<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Diagnostic results</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fff; --surface:#f2f5f4; --line:#d6ddda; --ink:#16211e; --muted:#5c6b66; --accent:#0e6b5f; --urgent:#b3412b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Instrument Sans",Arial,system-ui,sans-serif; color:var(--ink); background:var(--paper); font-size:1rem; line-height:1.5; }
  main { max-width: 72rem; margin: 0 auto; padding: 2rem 1.25rem; }
  h1 { font-size:1.7rem; font-weight:600; margin:0 0 .25rem; }
  .muted { color:var(--muted); }
  label { display:block; margin:1rem 0 .4rem; font-weight:500; }
  input, textarea { width:100%; font:inherit; padding:.6rem .8rem; border:1px solid var(--line); border-radius:8px; }
  button { font:inherit; font-weight:600; cursor:pointer; padding:.6rem 1.1rem; border-radius:999px; border:1px solid var(--accent); background:var(--accent); color:#fff; }
  button.quiet { background:transparent; color:var(--accent); }
  .row { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; margin:1rem 0; }
  .notice { border-left:3px solid var(--urgent); background:var(--surface); padding:.8rem 1rem; margin:1rem 0; border-radius:0 8px 8px 0; font-size:.95rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { padding:.5rem .5rem; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { font-weight:600; position:sticky; top:0; background:var(--paper); }
  .wrap { overflow-x:auto; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  details { margin:.5rem 0; }
  summary { cursor:pointer; color:var(--accent); font-weight:500; }
  .stat { display:inline-block; margin-right:1.5rem; }
  .stat b { font-size:1.4rem; font-weight:600; }
  .err { color:var(--urgent); font-weight:500; }
</style>
</head>
<body>
<main>
  <h1>Diagnostic results</h1>
  <p class="muted">Reads straight from Supabase. Nothing you paste here is stored or sent anywhere except your own Supabase project.</p>

  <div class="notice">The service role key bypasses all row security. Only paste it on a device you trust, and never commit it to the repo.</div>

  <label for="url">Supabase project URL</label>
  <input id="url" placeholder="https://xxxx.supabase.co">
  <label for="key">Service role key (Project settings > API > service_role)</label>
  <input id="key" type="password" placeholder="eyJ...">
  <label for="edition">Edition (leave blank for all)</label>
  <input id="edition" placeholder="2026-10">
  <div class="row">
    <button id="load">Load responses</button>
    <button id="csv" class="quiet" disabled>Download CSV</button>
    <button id="json" class="quiet" disabled>Download JSON</button>
    <span class="err" id="err"></span>
  </div>

  <div id="stats"></div>
  <div class="wrap"><table id="tbl" hidden><thead></thead><tbody></tbody></table></div>
  <div id="open"></div>
</main>

<script src="config.js"></script>
<script>
(() => {
  const C = window.TEST_CONFIG;
  const $ = id => document.getElementById(id);
  $('url').value = C.supabase.url.includes('YOUR-PROJECT') ? '' : C.supabase.url;
  $('edition').value = C.edition;

  let rows = [], key = null, scored = [];
  const p1 = C.sections.find(s => s.id === 'part1');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function get(path) {
    const r = await fetch($('url').value.replace(/\/$/, '') + '/rest/v1/' + path, {
      headers: { apikey: $('key').value, Authorization: 'Bearer ' + $('key').value },
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  $('load').addEventListener('click', async () => {
    $('err').textContent = '';
    try {
      const ed = $('edition').value.trim();
      const q = ed ? `responses?edition=eq.${encodeURIComponent(ed)}&order=finished_at.asc` : 'responses?order=finished_at.asc';
      rows = await get(q);
      const keys = await get(ed ? `answer_keys?edition=eq.${encodeURIComponent(ed)}` : 'answer_keys');
      key = Object.fromEntries(keys.map(k => [k.edition, k.key]));
      build();
    } catch (e) { $('err').textContent = 'Could not load: ' + e.message.slice(0, 200); }
  });

  function mins(a, b) { if (!a || !b) return ''; return ((Date.parse(b) - Date.parse(a)) / 60000).toFixed(1); }

  function build() {
    scored = rows.map(r => {
      const k = key[r.edition] || {};
      let score = 0; const per = {};
      for (const q of p1.questions) { const ok = k[q.id] !== undefined && r.answers?.[q.id] === k[q.id]; per[q.id] = ok ? 1 : 0; score += ok ? 1 : 0; }
      const st = r.section_times || {};
      const comfort = r.answers?.comfort || {};
      const focus = (r.answers?.focus || []).map(i => C.sections[2].questions.find(q => q.id === 'focus').options[i]).join('; ');
      const scenario = r.answers?.scenario === undefined ? '' : (r.answers.scenario === 0 ? 'A' : 'B');
      return {
        name: r.name, email: r.email, edition: r.edition,
        nickname: r.answers?.nickname || '', program: r.answers?.program || '',
        part1_score: score, ...Object.fromEntries(Object.entries(per).map(([k, v]) => ['p1_' + k, v])),
        part1_min: mins(st.part1?.start, st.part1?.end), part1_ended_by: st.part1?.reason || '',
        part2_min: mins(st.part2?.start, st.part2?.end), part2_ended_by: st.part2?.reason || '',
        scenario, friction: r.answers?.friction || '', intervention: r.answers?.intervention || '', evaluation: r.answers?.evaluation || '',
        comfort_research: comfort.research ?? '', comfort_visual: comfort.visual ?? '', comfort_service: comfort.service ?? '', comfort_prototyping: comfort.prototyping ?? '',
        focus, challenge: r.answers?.challenge || '',
        incidents: (r.incidents || []).length,
        incidents_part1: (r.incidents || []).filter(i => i.section === 'part1').length,
        started_at: r.started_at, finished_at: r.finished_at,
      };
    });

    const n = scored.length;
    const avg = n ? (scored.reduce((a, r) => a + r.part1_score, 0) / n).toFixed(2) : '0';
    const flagged = scored.filter(r => r.incidents_part1 > 0).length;
    $('stats').innerHTML = `<p><span class="stat"><b>${n}</b> responses</span><span class="stat"><b>${avg}</b> avg Part 1 (of ${p1.questions.length})</span><span class="stat"><b>${flagged}</b> left the tab during Part 1</span></p>` +
      (Object.keys(key).length ? '' : `<p class="err">No answer key found for this edition. Scores show as 0. Add it in Supabase (see README).</p>`);

    const cols = ['name', 'email', 'program', 'part1_score', 'part1_min', 'part1_ended_by', 'incidents_part1', 'scenario', 'comfort_research', 'comfort_visual', 'comfort_service', 'comfort_prototyping', 'focus'];
    const t = $('tbl'); t.hidden = false;
    t.tHead.innerHTML = '<tr>' + cols.map(c => `<th>${c.replace(/_/g, ' ')}</th>`).join('') + '</tr>';
    t.tBodies[0].innerHTML = scored.map(r => '<tr>' + cols.map(c => `<td class="${typeof r[c] === 'number' ? 'num' : ''}">${esc(r[c])}</td>`).join('') + '</tr>').join('');

    $('open').innerHTML = '<h2 style="font-size:1.2rem;margin-top:2rem">Part 2 and open answers</h2>' + scored.map(r => `<details><summary>${esc(r.name)} (${esc(r.scenario || 'no scenario')})</summary>
      <p><b>Friction</b><br>${esc(r.friction)}</p><p><b>Intervention</b><br>${esc(r.intervention)}</p><p><b>Evaluation</b><br>${esc(r.evaluation)}</p><p><b>Challenge</b><br>${esc(r.challenge)}</p></details>`).join('');

    $('csv').disabled = $('json').disabled = n === 0;
  }

  function download(name, text, type) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  }
  $('csv').addEventListener('click', () => {
    const cols = Object.keys(scored[0]);
    const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    download(`diagnostic-${$('edition').value || 'all'}.csv`, [cols.join(','), ...scored.map(r => cols.map(c => cell(r[c])).join(','))].join('\n'), 'text/csv');
  });
  $('json').addEventListener('click', () => download(`diagnostic-${$('edition').value || 'all'}.json`, JSON.stringify(rows, null, 2), 'application/json'));
})();
</script>
</body>
</html>
